spring.application.name=PingFilterAPI
server.servlet.context-path=/api
spring.flyway.enabled=true

db.url=jdbc:h2:/data/pingfilterdb
db.username=pingfilterdbuser
db.password=pingfilterdbpass

redis.enabled=false

#Spring Boot server configuration
server.address=0.0.0.0
server.port=8000

#H2 console web access configuration
#Open "http://0.0.0.0:8000/h2-console" and hit "Connect" button
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true